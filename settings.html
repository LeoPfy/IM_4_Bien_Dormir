<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bien Dormir — Einstellungen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-monitor">

  <header class="header">
    <div class="header-inner">
      <img src="img/logo.png" alt="Logo" class="header-logo" />
      <span class="header-title">Bien Dormir</span>
    </div>
  </header>

  <main class="monitor-main">

    <div class="page-title-row">
      <h1>Einstellungen</h1>
    </div>

    <div id="settingsSuccess" class="success-msg" role="status"></div>
    <div id="settingsError"   class="error-msg"   role="alert"></div>

    <form id="settingsForm">

      <!-- Temperatur -->
      <section class="settings-section">
        <h2 class="settings-heading">Temperatur Grenzwerte</h2>
        <div class="threshold-card">
          <div class="threshold-header">
            <span class="threshold-icon">🌡️</span>
            <span class="threshold-title">Idealer Bereich</span>
          </div>
          <div class="threshold-row">
            <div class="threshold-field">
              <label for="temp_min">Min (°C)</label>
              <input type="number" id="temp_min" step="0.5" min="10" max="30" placeholder="18" />
            </div>
            <div class="threshold-divider">–</div>
            <div class="threshold-field">
              <label for="temp_max">Max (°C)</label>
              <input type="number" id="temp_max" step="0.5" min="10" max="30" placeholder="22" />
            </div>
          </div>
        </div>
      </section>

      <!-- Luftfeuchtigkeit -->
      <section class="settings-section">
        <h2 class="settings-heading">Luftfeuchtigkeit Grenzwerte</h2>
        <div class="threshold-card">
          <div class="threshold-header">
            <span class="threshold-icon">💧</span>
            <span class="threshold-title">Idealer Bereich</span>
          </div>
          <div class="threshold-row">
            <div class="threshold-field">
              <label for="hum_min">Min (%)</label>
              <input type="number" id="hum_min" step="1" min="10" max="90" placeholder="40" />
            </div>
            <div class="threshold-divider">–</div>
            <div class="threshold-field">
              <label for="hum_max">Max (%)</label>
              <input type="number" id="hum_max" step="1" min="10" max="90" placeholder="60" />
            </div>
          </div>
        </div>
      </section>

      <!-- Lautstärke -->
      <section class="settings-section">
        <h2 class="settings-heading">Noise Level</h2>
        <div class="threshold-card">
          <div class="threshold-header">
            <span class="threshold-icon">🔊</span>
            <span class="threshold-title">Alert Threshold (dB)</span>
          </div>
          <div class="threshold-field">
            <label for="noise_max">Max (dB)</label>
            <input type="number" id="noise_max" step="1" min="10" max="100" placeholder="40" />
          </div>
        </div>
      </section>

      <button type="submit" class="btn-primary" id="saveSettingsBtn">Einstellungen speichern</button>

    </form>

    <!-- Account -->
    <section class="settings-section" style="margin-top: 12px;">
      <h2 class="settings-heading">Account</h2>
      <div class="settings-card">
        <a href="profil.html" class="settings-link">
          <span>Profil bearbeiten</span>
          <span>›</span>
        </a>
        <a href="#" class="settings-link logout-link" id="logoutBtn">
          <span>Logout</span>
          <span>›</span>
        </a>
      </div>
    </section>

  </main>

    <a href="monitor.html" class="nav-item">

    </a>

  </nav>

  <script src="js/settings.js"></script>
  <script src="js/logout.js"></script>

</body>
</html>
