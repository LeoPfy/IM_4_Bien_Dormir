<!-- profil.html
     Profilseite. Zeigt Vor- und Nachname des eingeloggten Users und ermöglicht Änderungen.
     Abhängigkeiten: css/style.css, js/profil.js, js/auth.js
-->

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bien Dormir — Profil</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="page-monitor">

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <img src="img/logo.png" alt="Logo" class="header-logo" />
      <span class="header-title">Bien Dormir</span>
    </div>
  </header>

  <!-- Main -->
  <main class="monitor-main">

    <div class="page-title-row">
      <h1>Profil</h1>
    </div>

    <section class="settings-section">
      <h2 class="settings-heading">Persönliche Angaben</h2>

      <div class="profile-card">

        <div id="successMsg" class="success-msg" role="status"></div>
        <div id="errorMsg" class="error-msg" role="alert"></div>

        <form id="profilForm">

          <div class="field">
            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" placeholder="Vorname" />
          </div>

          <div class="field">
            <label for="nachname">Nachname</label>
            <input type="text" id="nachname" placeholder="Nachname" />
          </div>

          <button type="submit" class="btn-primary" id="saveProfileBtn">
            Profil speichern
          </button>

        </form>

      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

    <a href="monitor.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
      </svg>
      <span>Monitor</span>
    </a>

    <a href="history.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span>Verlauf</span>
    </a>

    <a href="settings.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>

      </svg>
      <span>Settings</span>
    </a>

  </nav>

  <script src="js/auth.js"></script>
  <script src="js/profil.js"></script>

</body>
</html>
